name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Security and Integration Suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: memory://agentguard
          PAYPAL_ALLOW_LIVE_EXECUTION: 'false'

      - name: Build Gateway distribution
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Build Next.js Dashboard
        working-directory: ./dashboard
        run: npm run build
