services:
  # AgentGuard Security Gateway (Fastify Backend)
  - type: web
    name: agentguard-gateway
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: agentguard-postgres
          property: connectionString
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_ALLOW_LIVE_EXECUTION
        value: "false"
      - key: PAYPAL_TIMEOUT_MS
        value: "10000"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: POLICY_MAX_TRANSACTION_AMOUNT
        value: "50.00"
      - key: POLICY_MAX_DAILY_AMOUNT
        value: "200.00"
      - key: POLICY_ALLOWED_CURRENCIES
        value: "USD,EUR,GBP"
      - key: POLICY_REQUIRE_HUMAN_APPROVAL_THRESHOLD
        value: "25.00"

  # AgentGuard Security Analytics Dashboard (Next.js)
  - type: web
    name: agentguard-dashboard
    env: node
    plan: starter
    region: oregon
    buildCommand: cd dashboard && npm ci && npm run build
    startCommand: cd dashboard && npm run start -- -p 3000
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GATEWAY_URL
        fromService:
          type: web
          name: agentguard-gateway
          property: host

databases:
  - name: agentguard-postgres
    databaseName: agentguard_prod
    user: agentguard_user
    plan: starter
    region: oregon
