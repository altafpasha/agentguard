services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentguard_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/audit/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-agentguard_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentguard-net

  agentguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentguard-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: info
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentguard_dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-v1-placeholder}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-sandbox_client_id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-sandbox_client_secret}
      PAYPAL_ENVIRONMENT: sandbox
      PAYPAL_API_BASE_URL: https://api-m.sandbox.paypal.com
      PAYPAL_ALLOW_LIVE_EXECUTION: ${PAYPAL_ALLOW_LIVE_EXECUTION:-false}
      PAYPAL_TIMEOUT_MS: ${PAYPAL_TIMEOUT_MS:-10000}
      POLICY_MAX_TRANSACTION_AMOUNT: ${POLICY_MAX_TRANSACTION_AMOUNT:-50.00}
      POLICY_MAX_DAILY_AMOUNT: ${POLICY_MAX_DAILY_AMOUNT:-200.00}
      POLICY_ALLOWED_CURRENCIES: ${POLICY_ALLOWED_CURRENCIES:-USD,EUR,GBP,INR}
      POLICY_REQUIRE_HUMAN_APPROVAL_THRESHOLD: ${POLICY_REQUIRE_HUMAN_APPROVAL_THRESHOLD:-25.00}
      POLICY_RECIPIENT_DENYLIST: ${POLICY_RECIPIENT_DENYLIST:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder_key_id}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
      RAZORPAY_ALLOW_LIVE_EXECUTION: ${RAZORPAY_ALLOW_LIVE_EXECUTION:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agentguard-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agentguard-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AGENTGUARD_API_URL: "http://agentguard:3001"
      NEXT_PUBLIC_GATEWAY_URL: "http://localhost:${GATEWAY_PORT:-3001}"
    depends_on:
      agentguard:
        condition: service_healthy
    networks:
      - agentguard-net

volumes:
  postgres_data:
    driver: local

networks:
  agentguard-net:
    driver: bridge
