[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-sdk"
version = "1.0.0"
description = "Official Python SDK for the AgentGuard AI Agent Security Gateway"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AgentGuard Security Team", email = "security@agentguard.dev" }
]
keywords = [
    "agentguard",
    "ai-agent",
    "security-gateway",
    "policy-engine",
    "prompt-injection",
    "razorpay",
    "paypal",
    "fail-closed"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/altafpasha/agentguard"
Documentation = "https://github.com/altafpasha/agentguard/tree/main/docs"
Repository = "https://github.com/altafpasha/agentguard"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentguard*"]
